<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>ADhouse</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#f5f5f5; color:#333; }
    header { background:#111; color:#fff; padding:40px 20px; text-align:center; }
    section { max-width:1000px; margin:40px auto; padding:0 20px; }
    .products { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:20px; }
    .card { background:#fff; border-radius:12px; padding:20px; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
    .product-img { width:100%; border-radius:10px; margin-bottom:15px; }
    .btn { display:inline-block; margin-top:15px; padding:12px 20px; background:#111; color:#fff; text-decoration:none; border-radius:6px; }
    footer { background:#222; color:#ccc; text-align:center; padding:30px 10px; margin-top:60px; }
  </style>
</head>
<body>

<header>
  <h1>ADhouse</h1>
  <p>맞춤 제작 · 빠른 상담 · 깔끔한 마감</p>
</header>

<section>
  <h2>판매 상품</h2>
  <div class="products">

    <div class="card">
      <img src="images/acrylic.png" alt="아크릴 제작" class="product-img">
      <h3>아크릴 제작</h3>
      <p>아크릴 스탠드 / 간판 / 표지판</p>
      <a class="btn" href="acrylic.html">주문하기</a>
    </div>

    <div class="card">
      <img src="images/banner.png" alt="배너 제작" class="product-img">
      <h3>배너 제작</h3>
      <p>X배너 / 현수막 / 실내용 배너</p>
      <a class="btn" href="banner.html">주문하기</a>
    </div>

  </div>
</section>

<footer>
  <p>© ADhouse</p>
</footer>

</body>
</html>
